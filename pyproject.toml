[project]
name = "blockguard"
version = "0.1.0"
description = "Hidden hallucination-filtering funnel for AI model outputs"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "spacy>=3.7.0",
    "lightgbm>=4.2.0",
    "transformers>=4.36.0",
    "torch>=2.1.0",
    "sentence-transformers>=2.5.0",
    "nltk>=3.8.1",
    "scikit-learn>=1.3.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pydantic>=2.5.0",
    "httpx>=0.25.0",
    "click>=8.1.0",
]

[project.scripts]
blockguard = "blockguard.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "pytest-asyncio>=0.23.0"]
openai = ["openai>=1.0.0"]
anthropic = ["anthropic>=0.18.0"]
vllm = ["vllm>=0.4.0"]
full = ["blockguard[openai,anthropic,vllm]"]

[tool.setuptools.packages.find]
where = ["."]
include = ["blockguard*"]

[build-system]
requires = ["setuptools>=68.0", "wheel>=0.40.0"]
build-backend = "setuptools.build_meta"
